<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f3ff" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00f3ff" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7000ff" />
    </marker>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="100%" height="100%" fill="#070913" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title Header -->
  <text x="400" y="42" fill="#ffffff" font-size="16" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">
    SentinelLedger: Distributed Financial Engine Architecture
  </text>

  <!-- Node 1: Client / Ingestion -->
  <g transform="translate(45, 170)">
    <rect width="110" height="120" rx="10" fill="#0b0f19" stroke="#00f3ff" stroke-width="1.8" filter="url(#glow-cyan)" />
    <circle cx="55" cy="40" r="16" fill="none" stroke="#00f3ff" stroke-width="2" />
    <path d="M 38 72 C 38 56, 72 56, 72 72" fill="none" stroke="#00f3ff" stroke-width="2" />
    <text x="55" y="94" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Client API</text>
    <text x="55" y="108" fill="#00f3ff" font-size="9" font-family="monospace" text-anchor="middle">10k+ RPS</text>
  </g>

  <!-- Connection: Client -> Orchestrator -->
  <path d="M 155 230 L 195 230" fill="none" stroke="#00f3ff" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 2: Payment Orchestrator (Saga Core) -->
  <g transform="translate(205, 160)">
    <rect width="140" height="140" rx="10" fill="#0b0f19" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan)" />
    <!-- Gear Icon -->
    <circle cx="70" cy="45" r="14" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="4,2" />
    <circle cx="70" cy="45" r="6" fill="#00f3ff" />
    <text x="70" y="82" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Orchestrator</text>
    <text x="70" y="98" fill="#a0aec0" font-size="10" font-family="sans-serif" text-anchor="middle">Spring Boot 3</text>
    <rect x="20" y="108" width="100" height="18" rx="4" fill="#00f3ff" fill-opacity="0.15" />
    <text x="70" y="121" fill="#00f3ff" font-size="9" font-family="monospace" font-weight="600" text-anchor="middle">SAGA ENGINE</text>
  </g>

  <!-- Top Branch: Redis Redlock -->
  <path d="M 275 160 L 275 115" fill="none" stroke="#00f3ff" stroke-width="1.8" marker-end="url(#arrow)" />
  <g transform="translate(215, 45)">
    <rect width="120" height="65" rx="8" fill="#0b0f19" stroke="#ef4444" stroke-width="1.5" />
    <rect x="52" y="14" width="16" height="12" rx="2" fill="none" stroke="#ef4444" stroke-width="2" />
    <path d="M 55 14 L 55 9 A 5 5 0 0 1 65 9 L 65 14" fill="none" stroke="#ef4444" stroke-width="2" />
    <text x="60" y="42" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Redis Redlock</text>
    <text x="60" y="55" fill="#ef4444" font-size="8.5" font-family="monospace" text-anchor="middle">Mutex Idempotency</text>
  </g>

  <!-- Bottom Branch: ONNX ML Fraud Evaluation -->
  <path d="M 275 300 L 275 345" fill="none" stroke="#7000ff" stroke-width="1.8" marker-end="url(#arrow-purple)" />
  <g transform="translate(205, 350)">
    <rect width="140" height="75" rx="8" fill="#0b0f19" stroke="#7000ff" stroke-width="1.8" filter="url(#glow-purple)" />
    <!-- Brain / Lightning AI icon -->
    <path d="M 70 15 L 62 28 L 69 28 L 67 40 L 78 25 L 71 25 Z" fill="#7000ff" />
    <text x="70" y="54" fill="#ffffff" font-size="11" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">ONNX Runtime</text>
    <text x="70" y="67" fill="#a78bfa" font-size="8.5" font-family="monospace" text-anchor="middle">&lt;15ms Fraud Check</text>
  </g>

  <!-- Connection: Orchestrator -> Kafka Backbone -->
  <path d="M 345 230 L 400 230" fill="none" stroke="#00f3ff" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 3: Apache Kafka Event Bus -->
  <g transform="translate(410, 150)">
    <rect width="125" height="160" rx="10" fill="#0b0f19" stroke="#00f3ff" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#glow-cyan)" />
    <text x="62" y="32" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Apache Kafka</text>
    <text x="62" y="46" fill="#00f3ff" font-size="8.5" font-family="monospace" text-anchor="middle">Event Backbone</text>
    
    <!-- Topic Partitions Visual -->
    <rect x="15" y="60" width="95" height="22" rx="4" fill="#161f30" stroke="#00f3ff" stroke-width="0.8" />
    <text x="62" y="75" fill="#90cdf4" font-size="8.5" font-family="monospace" text-anchor="middle">partition-0 (ACID)</text>
    
    <rect x="15" y="90" width="95" height="22" rx="4" fill="#161f30" stroke="#00f3ff" stroke-width="0.8" />
    <text x="62" y="105" fill="#90cdf4" font-size="8.5" font-family="monospace" text-anchor="middle">partition-1 (SAGA)</text>

    <rect x="15" y="120" width="95" height="22" rx="4" fill="#161f30" stroke="#ef4444" stroke-width="0.8" />
    <text x="62" y="135" fill="#fca5a5" font-size="8.5" font-family="monospace" text-anchor="middle">DLQ / Reversals</text>
  </g>

  <!-- Connection: Kafka -> Ledger DB & Wallet -->
  <path d="M 535 200 L 595 170" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 535 260 L 595 290" fill="none" stroke="#00f3ff" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Node 4: Append-Only Ledger Engine (PostgreSQL) -->
  <g transform="translate(605, 115)">
    <rect width="150" height="105" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="2" filter="url(#glow-emerald)" />
    <!-- Cylinder Database Icon -->
    <ellipse cx="75" cy="24" rx="22" ry="7" fill="none" stroke="#10b981" stroke-width="1.8" />
    <path d="M 53 24 L 53 44 A 22 7 0 0 0 97 44 L 97 24" fill="none" stroke="#10b981" stroke-width="1.8" />
    <text x="75" y="65" fill="#ffffff" font-size="12" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">Ledger DB</text>
    <text x="75" y="80" fill="#a0aec0" font-size="9.5" font-family="sans-serif" text-anchor="middle">PostgreSQL ACID</text>
    <text x="75" y="94" fill="#34d399" font-size="8.5" font-family="monospace" text-anchor="middle">Append-Only / No UPDATE</text>
  </g>

  <!-- Node 5: Wallet Projection Service -->
  <g transform="translate(605, 250)">
    <rect width="150" height="95" rx="8" fill="#0b0f19" stroke="#00f3ff" stroke-width="1.5" />
    <!-- Wallet Card Icon -->
    <rect x="55" y="16" width="38" height="24" rx="3" fill="none" stroke="#00f3ff" stroke-width="1.5" />
    <circle cx="82" cy="28" r="3" fill="#00f3ff" />
    <text x="75" y="57" fill="#ffffff" font-size="11.5" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">Wallet Service</text>
    <text x="75" y="72" fill="#a0aec0" font-size="9" font-family="sans-serif" text-anchor="middle">Read-Optimized View</text>
    <text x="75" y="84" fill="#00f3ff" font-size="8.5" font-family="monospace" text-anchor="middle">CQRS Projections</text>
  </g>

  <!-- Bottom Metric Telemetry Ribbon -->
  <g transform="translate(180, 448)">
    <rect width="440" height="34" rx="17" fill="#0f172a" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="17" r="4" fill="#10b981" />
    <text x="35" y="21" fill="#e2e8f0" font-size="10.5" font-family="monospace">Throughput: 10,000+ RPS</text>
    <text x="210" y="21" fill="#64748b" font-size="10.5" font-family="monospace">|</text>
    <text x="225" y="21" fill="#e2e8f0" font-size="10.5" font-family="monospace">Saga Rollbacks: Zero-Loss</text>
  </g>
</svg>
